# nginx.conf — AUCTONIQ reverse proxy.
#
# INSTALL
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/auctoniq
#     sudo ln -s /etc/nginx/sites-available/auctoniq /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# THIS FILE IS WRITTEN FOR THE IP-NOW, DOMAIN-LATER PATH.
#
# As shipped it serves plain HTTP on port 80 and answers to any hostname, so it
# works the moment the VM has an address. Everything functions over plain HTTP,
# live bidding included: the mixed-content rule that blocks ws:// applies only
# to pages loaded over https://, and an http:// page may open a ws:// socket
# freely. The console uses no secure-context-only browser API -- no clipboard,
# no crypto.subtle, no service worker -- so nothing silently degrades.
#
# What you DO give up until the domain lands: the auctioneer password and the
# admin key cross the network in clear text, and browsers show "Not secure".
# Treat the IP phase as a staging deployment, not as where you run a real
# auction.
#
# WHEN THE DOMAIN ARRIVES
#     1. Point an A record at this server's IP and wait for it to resolve.
#     2. Replace `server_name _;` below with the real hostname. certbot matches
#        server blocks BY NAME and cannot do anything with the `_` catch-all.
#     3. sudo nginx -t && sudo systemctl reload nginx
#     4. sudo apt install certbot python3-certbot-nginx
#        sudo certbot --nginx -d auctoniq.example.com
#
#        certbot rewrites this file in place: it adds a listen 443 block with
#        the certificate paths and converts this one into a 301 redirect. You do
#        not need to hand-write any of that, which is why there is no commented
#        TLS block here to fall out of date.
#     5. Add the https:// origin to CORS_ORIGINS in .env and restart auctoniq.
#        Only needed for /docs or a second frontend -- the console is served
#        same-origin and never consults CORS.


# WebSocket upgrade handshake.
#
# A proxied WebSocket needs Connection: upgrade while every ordinary request
# needs Connection: close, and the difference is per-request rather than
# per-location -- so it cannot be a static header. This map computes it from
# whether the client sent an Upgrade header.
#
# `map` belongs at http level; a file in sites-available is included inside
# http {}, so here is correct. If nginx -t reports "map directive is not allowed
# here", this file is being included somewhere else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream auctoniq {
    # Matches HOST/PORT in deploy/auctoniq.service. The app binds loopback
    # deliberately so this proxy is the only way in.
    server 127.0.0.1:8000;

    # Hold connections open between requests rather than completing a TCP
    # handshake per request.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # `_` matches any hostname, which is what makes this work by bare IP.
    # REPLACE THIS with your domain before running certbot -- see step 2 above.
    server_name _;

    # Ingestion accepts a spreadsheet upload. The default is 1 MB, which rejects
    # it with a 413 that looks like a frontend bug.
    client_max_body_size 20m;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    # Compress text responses. NOT gzip_static: the Vite build does not emit
    # .gz siblings. Explicitly excludes already-compressed types.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    access_log /var/log/nginx/auctoniq.access.log;
    error_log  /var/log/nginx/auctoniq.error.log;


    # --- the auction WebSocket ------------------------------------------------
    # FIRST, because it is the one location with genuinely different timeouts and
    # nginx matches prefixes longest-first regardless of order -- but keeping it
    # first makes the intent readable.
    location /api/v1/auction/ws {
        proxy_pass http://auctoniq;

        # HTTP/1.1 is required for an upgrade. The default is 1.0, over which
        # the handshake simply does not happen and the client sees a 400.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An hour of silence allowed.
        #
        # proxy_read_timeout measures time since the last byte FROM the upstream,
        # and the default is 60 seconds. An auction socket is legitimately quiet
        # between lots -- the room broadcasts on state changes, not on a clock --
        # so the default silently drops every franchise roughly a minute into any
        # pause, mid-auction, with no error anywhere except a client reconnect.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffering holds a response until it is complete, which for a socket
        # means holding bids. Off is mandatory here, not an optimisation.
        proxy_buffering off;
    }


    # --- the API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://auctoniq;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto is what uvicorn's --proxy-headers reads to learn the
        # request arrived over TLS. Without it the app believes it is serving
        # HTTP and builds http:// URLs, which a browser on an https page refuses
        # as mixed content. $scheme is correct in both phases: http now, https
        # automatically once certbot adds the 443 block.
        proxy_set_header X-Forwarded-Proto $scheme;

        # 300s, against the application's own longest budget.
        #
        # SCOUT_HERMES_AGENT_TIMEOUT is 180s and a research turn can add to it,
        # so nginx's 60s default would cut SCOUT off at roughly a third of its
        # allowance and return 504 -- indistinguishable, from the console, from
        # the agent failing. nginx must outlast the app so the app's own timeout
        # and its own error message are what the user sees.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }


    # --- hashed build assets --------------------------------------------------
    # Served from disk rather than proxied, and that matters more here than it
    # usually does: the app runs ONE uvicorn worker because the auction room is
    # in-process state, so every asset byte uvicorn serves is time its single
    # event loop is not processing bids. Ten franchises opening the console at
    # once should not contend with the lot in progress.
    #
    # Requires nginx (www-data) to traverse the path:
    #     sudo chmod o+x /opt /opt/auctoniq
    #     sudo chmod -R o+rX /opt/auctoniq/dist
    #
    # If you would rather not widen those bits, delete this block entirely --
    # the catch-all below proxies these paths to uvicorn, which serves them
    # correctly. You lose the offload, nothing else.
    location /assets/ {
        # `root`, NOT `alias`, and the difference is not stylistic.
        #
        # root appends the whole request URI to this path, so /assets/x.js
        # resolves to /opt/auctoniq/dist/assets/x.js -- the same result an alias
        # would give. But try_files combined with alias is a long-standing nginx
        # defect: $uri is resolved against root rather than the alias, so the
        # fallback below would look in the wrong directory and the location
        # would 404 or loop depending on version. Using root sidesteps it
        # entirely.
        root /opt/auctoniq/dist;

        # Vite content-hashes every filename here, so a changed file is a
        # changed URL and this can be cached permanently. immutable additionally
        # stops revalidation on reload.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Fall through to the app rather than 404 if a file is missing, so a
        # stale index.html referencing a removed asset degrades to the app's own
        # handling instead of a bare nginx error page.
        try_files $uri @app;
    }


    # --- the console ----------------------------------------------------------
    # Everything else is a client-side route. api/main.py's catch-all returns
    # index.html for unmatched paths so a deep link survives a refresh.
    location / {
        proxy_pass http://auctoniq;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location @app {
        proxy_pass http://auctoniq;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers are deliberately NOT set here. api/main.py already adds
    # them in its own middleware -- including Strict-Transport-Security -- and
    # setting them in both places produces duplicate headers that browsers
    # resolve inconsistently. One owner.
}
